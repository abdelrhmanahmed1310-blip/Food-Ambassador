<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Food Ambassador — offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #f6f7f5;
        color: #1b1f1c;
        margin: 0;
        padding: 2rem 1.25rem;
      }
      h1 {
        color: #1f6f43;
        font-size: 1.4rem;
      }
      p {
        line-height: 1.5;
        max-width: 32rem;
      }
      button {
        margin-top: 1rem;
        min-height: 3rem;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: #1f6f43;
        color: #fff;
        font-size: 1rem;
      }
      [dir="rtl"] {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>No connection</h1>
    <p>
      Food Ambassador needs the internet the first time it opens. After you have opened the till
      once, it keeps working without a connection.
    </p>
    <div dir="rtl" lang="ar">
      <h1>لا يوجد اتصال</h1>
      <p>
        يحتاج Food Ambassador إلى الإنترنت عند فتحه أول مرة. بعد فتح شاشة البيع مرة واحدة، تعمل دون
        اتصال.
      </p>
    </div>
    <button type="button" onclick="location.reload()">Try again — إعادة المحاولة</button>
  </body>
</html>
