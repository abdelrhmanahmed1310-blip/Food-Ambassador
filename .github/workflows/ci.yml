name: CI

on:
  # Every branch is verified on push (development happens on feature branches).
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: food
          POSTGRES_PASSWORD: food_ci_password
          POSTGRES_DB: food_ambassador_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U food -d food_ambassador_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://food:food_ci_password@localhost:5432/food_ambassador_test?schema=public
      TEST_DATABASE_URL: postgresql://food:food_ci_password@localhost:5432/food_ambassador_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      # CI-only secret for the disposable test environment.
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-000
      TRUSTED_PROXY_HOPS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
