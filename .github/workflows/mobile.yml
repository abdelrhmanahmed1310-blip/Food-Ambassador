name: Mobile apps

# Builds the App Store / Google Play shells (DECISIONS.md ADR-061) on real
# toolchains: an Android debug APK and an unsigned iOS simulator build. Store
# signing and upload need the organization's developer accounts and are done
# from docs/MOBILE_RELEASE.md, not here.
on:
  push:
    branches: ["**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values: they only prove the projects build.
  MOBILE_SERVER_URL: https://app.example.invalid
  MOBILE_APP_ID: com.example.foodambassador

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run sync
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: food-ambassador-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Build for the iOS simulator (unsigned)
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build
