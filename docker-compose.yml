# Local development dependencies. Credentials here are development-only placeholders.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food_dev_password
      POSTGRES_DB: food_ambassador
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food_ambassador"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
