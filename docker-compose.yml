# Local development dependencies. Credentials here are development-only placeholders.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food_dev_password
      POSTGRES_DB: food_ambassador
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food -d food_ambassador"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional virus scanner for attachments (ADR-055): `docker compose --profile scan up -d`,
  # then set CLAMAV_URL=tcp://localhost:3310. The image updates its signatures with freshclam.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav

volumes:
  postgres-data:
  clamav-db:
