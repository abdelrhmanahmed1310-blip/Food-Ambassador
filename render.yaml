# Render Blueprint for a DEMO instance (ADR-076). Not for production: production
# hosting and data residency are still open (DECISIONS.md Q-03).
#
# In Render: New → Blueprint → connect this repository → Apply. Render creates
# the database and the web service, generates AUTH_SECRET and SEED_PASSWORD,
# runs the migrations and the [DEMO] seed before each deploy, then starts the app.
# The demo users' password is SEED_PASSWORD in the service's Environment tab.

databases:
  - name: food-ambassador-demo-db
    databaseName: food_ambassador
    user: food_ambassador
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    # Reachable only from Render services, not from the internet.
    ipAllowList: []

services:
  - type: web
    name: food-ambassador-demo
    runtime: node
    # Standard (2 GB): the app server uses ~350–500 MB and the demo seed ~430 MB,
    # too close to Starter's 512 MB limit. Pre-deploy commands need a paid instance.
    plan: standard
    region: frankfurt
    branch: milestone-0-foundation
    autoDeploy: true
    # Stays under Render's 8 GB build limit without dropping any check: the
    # full typecheck runs first as its own step (a type error fails the
    # deploy), then `next build` with LOW_MEMORY_BUILD=1 (next.config.ts)
    # skips its duplicate TypeScript pass and uses two workers.
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile --prod=false && npx --yes pnpm@10.28.0 typecheck && LOW_MEMORY_BUILD=1 npx --yes pnpm@10.28.0 build
    # Migrations, then the idempotent [DEMO] seed (it refuses NODE_ENV=production
    # unless ALLOW_DEMO_SEED is set). Binaries are called directly — no npm/npx
    # wrapper process, which costs ~80 MB each.
    preDeployCommand: ./node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/tsx --conditions=react-server --tsconfig tsconfig.json prisma/seed.ts
    # APP_URL defaults to the address Render gives the service. Next runs under
    # node directly (no npx wrapper) with the heap capped below the 2 GB instance.
    startCommand: APP_URL="${APP_URL:-$RENDER_EXTERNAL_URL}" NODE_OPTIONS=--max-old-space-size=1536 node node_modules/next/dist/bin/next start -p "$PORT"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: food-ambassador-demo-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
      # This is a demo deployment: the [DEMO] seed may run although NODE_ENV is production.
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
